server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: knowledgehub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

knowledgehub:
  storage:
    upload-dir: ${KNOWLEDGEHUB_UPLOAD_DIR:./data/uploads}
    okf-dir: ${KNOWLEDGEHUB_OKF_DIR:./data/okf}
    max-file-size-bytes: 26214400 # 25MB
    allowed-extensions:
      - pdf
      - docx
      - ppt
      - pptx
      - txt
      - md
      - csv
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351}
    expiration-ms: 86400000 # 24 hours
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:llama3.2}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    timeout-seconds: 60
    max-retries: 0
    mock-fallback-enabled: ${OLLAMA_MOCK_FALLBACK:true}
  rag:
    chunk-size: 800
    chunk-overlap: 150
    batch-size: 10
    top-k: 5
    similarity-threshold: 0.20
    hybrid-search: true
